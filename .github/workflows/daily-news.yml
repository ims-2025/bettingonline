name: Weekly News Publisher

# REDUCED from daily to twice-weekly (Tue + Fri) per SEO-RECOVERY-PLAN.md.
# Daily templated publishing was triggering "Crawled - currently not indexed"
# quality signals in GSC. Twice-weekly with unchanged quality per article
# keeps freshness signal alive without flooding Google with thin templated
# content while the algorithmic-trust rebuild is in progress.

on:
  schedule:
    # 06:00 UTC every Tuesday and Friday.
    - cron: '0 6 * * 2,5'
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write   # required to commit + push back to the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config user.email "editorial-bot@bettingonline.org"
          git config user.name "BettingOnline.org Editorial Bot"

      - name: Generate today's articles
        run: |
          python3 scripts/generate-daily-news.py
        # The generator script itself runs `git add`, `git commit`, and
        # `git push`. The push uses the runner's GITHUB_TOKEN, which is
        # configured by actions/checkout above.

      - name: Confirm deploy
        run: |
          echo "Pushed to main. Vercel will auto-deploy."
          git log -1 --oneline
